{% extends "base.html" %}

{% block title %}Page Not Found (404) | MediPredict{% endblock %}

{% block content %}
<div class="page-container text-center py-5">
    <div class="dashboard-card max-w-md mx-auto py-5" style="max-width: 500px; margin: 3rem auto;">
        <div class="stat-icon orange mx-auto mb-3" style="width: 70px; height: 70px; font-size: 32px;">
            <i class="bi bi-question-circle-fill"></i>
        </div>
        <h2 class="mb-2">404 - Page Not Found</h2>
        <p class="text-muted mb-4">The page or medical record you requested could not be found or has been relocated.</p>
        <a href="{{ url_for('home') }}" class="btn-primary-custom d-inline-block">
            <i class="bi bi-house-door me-1"></i> Return to Home
        </a>
    </div>
</div>
{% endblock %}

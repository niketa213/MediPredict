{% extends "base.html" %}

{% block title %}Internal Server Error (500) | MediPredict{% endblock %}

{% block content %}
<div class="page-container text-center py-5">
    <div class="dashboard-card max-w-md mx-auto py-5" style="max-width: 500px; margin: 3rem auto;">
        <div class="stat-icon red mx-auto mb-3" style="width: 70px; height: 70px; font-size: 32px;">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>
        <h2 class="mb-2">500 - Server Error</h2>
        <p class="text-muted mb-4">An unexpected server error occurred. Our administrative team has been notified.</p>
        <a href="{{ url_for('home') }}" class="btn-primary-custom d-inline-block">
            <i class="bi bi-house-door me-1"></i> Return to Home
        </a>
    </div>
</div>
{% endblock %}
